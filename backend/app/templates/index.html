<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Rainfall Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Basic CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="map"></div>
    
    <!-- Map Controls -->
    <div class="map-controls">
        <button id="zoomInBtn" class="control-btn" title="Zoom In">+</button>
        <button id="zoomOutBtn" class="control-btn" title="Zoom Out">−</button>
        <button id="resetBtn" class="control-btn" title="Reset Map">↺</button>
    </div>
    
    <!-- Status Bar -->
    <div id="status" class="status-bar">Loading map...</div>
    
    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Map Script -->
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
